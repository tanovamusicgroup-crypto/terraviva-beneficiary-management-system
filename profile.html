<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile</title><link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="shared.js"></script>
<style>
:root{--g:#2e7d32;--bg:#f3f7f4;--c:#fff;--tx:#17301f;--mu:#5c7165;--bd:#dbe6df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--c:#17251d;--tx:#e6f0ea;--mu:#9bb0a3;--bd:#27382e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:40px}header a{color:var(--g);font-size:14px}header a:first-of-type{margin-left:auto}
main{padding:16px;max-width:560px;margin:auto}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:22px;margin-bottom:14px;text-align:center}
input{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;font-size:13px;color:var(--mu);text-align:left}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;margin:4px}button.s{background:var(--bd);color:var(--tx)}.mu{color:var(--mu);font-size:13px}.msg{color:#c62828;font-size:14px}.ok{color:var(--g);font-size:14px}
</style></head><body><header><img src="logo.png" alt="Terraviva"><b>My profile</b><a href="/">Dashboard</a><a href="/programs.html">Programs</a><a href="/manage.html">Manage</a></header><main id="m"><p class="mu">Loading…</p></main>
<script>
const sb=supabase.createClient('https://rhkdzihvndbfanhodlex.supabase.co','sb_publishable_CRzNoKrPLp-G6o6P98Ua6w_-0VhGfpp');
const $=s=>document.querySelector(s),m=$('#m'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,uid;
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return m.innerHTML='<p>Please <a href="/">sign in</a> first.</p>';uid=user.id;load()})();
async function load(note){me=(await sb.from('profiles').select('*').eq('id',uid).single()).data;if(!me)return m.innerHTML='<p class="mu">No access.</p>';
m.innerHTML=`<div class="card"><div id="pv">${avatarHTML(me.avatar_path,me.full_name,120)}</div><h2 style="margin:10px 0 0">${esc(me.full_name)}</h2><p class="mu">${esc((me.role||'').replace('_',' '))}</p>
<label>Profile picture (JPG, PNG, WEBP or GIF, max 5 MB)</label><input id="f" type="file" accept="image/*"><p class="msg" id="er"></p><p class="ok" id="ok">${note||''}</p>
<button id="up">Save picture</button>${me.avatar_path?'<button class="s" id="rm">Remove picture</button>':''}</div>
<div class="card"><label>Display name</label><input id="n" value="${esc(me.full_name)}"><button id="sn">Save name</button></div>`;
$('#f').onchange=e=>{const f=e.target.files[0];if(f)$('#pv').innerHTML=`<img src="${URL.createObjectURL(f)}" style="width:120px;height:120px;border-radius:50%;object-fit:cover">`};
$('#up').onclick=async()=>{const f=$('#f').files[0];if(!f)return $('#er').textContent='Choose a picture first.';if(!f.type.startsWith('image/'))return $('#er').textContent='The file must be an image.';if(f.size>5242880)return $('#er').textContent='The picture is larger than 5 MB.';
$('#up').disabled=true;$('#up').textContent='Saving…';const path=uid+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');const u=await sb.storage.from('avatars').upload(path,f,{contentType:f.type});
if(u.error){$('#up').disabled=false;$('#up').textContent='Save picture';return $('#er').textContent=u.error.message}
const r=await sb.rpc('set_my_avatar',{p:path});if(r.error){$('#up').disabled=false;$('#up').textContent='Save picture';return $('#er').textContent=r.error.message}
if(me.avatar_path)await sb.storage.from('avatars').remove([me.avatar_path]);load('Picture saved.')};
if($('#rm'))$('#rm').onclick=async()=>{const r=await sb.rpc('set_my_avatar',{p:null});if(r.error)return $('#er').textContent=r.error.message;await sb.storage.from('avatars').remove([me.avatar_path]);load('Picture removed.')};
$('#sn').onclick=async()=>{const n=$('#n').value.trim();if(!n)return $('#er').textContent='Name cannot be empty.';const r=await sb.rpc('set_my_name',{n});if(r.error)$('#er').textContent=r.error.message;else load('Name saved.')}}
</script></body></html>
