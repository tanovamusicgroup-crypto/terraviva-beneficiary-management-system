<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Beneficiaries</title><link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="shared.js"></script>
<style>
:root{--g:#2e7d32;--bg:#f3f7f4;--c:#fff;--tx:#17301f;--mu:#5c7165;--bd:#dbe6df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--c:#17251d;--tx:#e6f0ea;--mu:#9bb0a3;--bd:#27382e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:40px}header a{color:var(--g);font-size:14px}header a:first-of-type{margin-left:auto}
main{padding:16px;max-width:1000px;margin:auto}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
input{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto}label{display:block;font-size:13px;color:var(--mu)}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;margin-right:6px}button.s{background:var(--bd);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.msg{color:#c62828;font-size:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}.tw{overflow-x:auto}
</style></head><body><header><img src="logo.png" alt="Terraviva"><b>Import beneficiaries</b><a href="/">Dashboard</a><a href="/beneficiaries.html">Beneficiaries</a></header><main id="m"><p class="mu">Loading…</p></main>
<script>
const sb=window.SB;const $=s=>document.querySelector(s),m=$('#m'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV=['Country','Region','District','Ward','Village/Street'];let me,depts=[],L=[],rows=[];
const COLS=['first_name','middle_name','last_name','sex','date_of_birth','phone','email','department','category','position','country','region','district','ward','village','address','nationality','notes'];
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return m.innerHTML='<p>Please <a href="/">sign in</a> first.</p>';
me=(await sb.from('profiles').select('*').eq('id',user.id).single()).data;if(!me||!['super_admin','org_admin','dept_manager','data_entry'].includes(me.role))return m.innerHTML='<p class="mu">Your role cannot import beneficiaries.</p>';
depts=(await sb.from('departments').select('*').order('name')).data||[];L=await fetchAll((f,t)=>sb.from('locations').select('*').range(f,t));view()})();
function parse(t){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))R.push(r);r=[]}else c+=ch}if(c!==''||r.length){r.push(c);if(r.some(x=>x.trim()!==''))R.push(r)}return R}
function view(){m.innerHTML=`<div class="card"><b>1. Download the template</b><p class="mu">Fill it in Excel or Google Sheets and save as CSV. Required: first_name, last_name, department (exact department name). Dates use YYYY-MM-DD. Location columns (country … village) are created if they do not exist.</p><button class="s" id="tp">Download CSV template</button></div>
<div class="card"><b>2. Upload your CSV file</b><input type="file" id="f" accept=".csv,text/csv"><label><input type="checkbox" id="sk" checked> Skip rows that look like duplicates (same phone or same name)</label><p class="msg" id="er"></p></div><div id="pv"></div>`;
$('#tp').onclick=()=>{const c=COLS.join(',')+'\nAsha,,Juma,Female,1995-04-12,0712345678,,Sustainable Agriculture,Women Farmers,Farmer,Tanzania,Mwanza,Ilemela,Nyakato,Street A,,Tanzanian,';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='beneficiaries_template.csv';a.click()};
$('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;const R=parse(await f.text());if(R.length<2)return $('#er').textContent='The file has no data rows.';const h=R[0].map(x=>x.trim().toLowerCase());if(!h.includes('first_name')||!h.includes('last_name')||!h.includes('department'))return $('#er').textContent='Missing required columns: first_name, last_name, department.';$('#er').textContent='';
rows=R.slice(1).map((r,i)=>{const o={_n:i+2,_e:[]};h.forEach((k,j)=>o[k]=(r[j]||'').trim());return o});check()}}
async function check(){$('#pv').innerHTML='<div class="card"><p class="mu">Checking '+rows.length+' rows…</p></div>';const dn=Object.fromEntries(depts.filter(d=>d.active).map(d=>[d.name.toLowerCase(),d]));const seen=new Set();
for(const r of rows){const d=dn[(r.department||'').toLowerCase()];if(!r.first_name||!r.last_name)r._e.push('First and last name are required');if(!d)r._e.push('Unknown or inactive department');else{r._d=d.id;if(['dept_manager','data_entry'].includes(me.role)&&d.id!=me.department_id)r._e.push('Not your department')}
if(r.date_of_birth&&!/^\d{4}-\d{2}-\d{2}$/.test(r.date_of_birth))r._e.push('Date must be YYYY-MM-DD');if(r.sex&&!['female','male','other'].includes(r.sex.toLowerCase()))r._e.push('Sex must be Female, Male or Other');
const k=(r.phone||'').replace(/\D/g,'')||(r.first_name+'|'+r.last_name).toLowerCase();if(seen.has(k))r._dup='Duplicate inside the file';seen.add(k)}
const ok=rows.filter(r=>!r._e.length&&!r._dup);for(let i=0;i<ok.length;i+=8)await Promise.all(ok.slice(i,i+8).map(async r=>{const x=await sb.rpc('find_duplicates',{p_first:r.first_name,p_last:r.last_name,p_phone:r.phone||null,p_dob:r.date_of_birth||null});if((x.data||[]).length)r._dup='Already registered: '+x.data[0].code}));
const bad=rows.filter(r=>r._e.length),dup=rows.filter(r=>!r._e.length&&r._dup);
$('#pv').innerHTML=`<div class="card"><b>3. Review</b><p>${rows.length} rows · <b>${rows.length-bad.length-dup.length}</b> ready · ${dup.length} possible duplicates · ${bad.length} with errors</p>
<div class="tw"><table><tr><th>Row</th><th>Name</th><th>Department</th><th>Phone</th><th>Problem</th></tr>${rows.filter(r=>r._e.length||r._dup).slice(0,60).map(r=>`<tr><td>${r._n}</td><td>${esc(r.first_name+' '+r.last_name)}</td><td>${esc(r.department)}</td><td>${esc(r.phone)}</td><td>${esc(r._e.join('; ')||r._dup)}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No problems found.</td></tr>'}</table></div>
<p class="mu">Rows with errors are never imported. ${['data_entry'].includes(me.role)?'Imported records go to the review queue.':'Imported records become Active.'}</p><p class="msg" id="er2"></p><button id="go">Import ready rows</button></div>`;
$('#go').onclick=()=>run()}
async function resolveLoc(names,cache){let parent=null,loc=null,key='';for(let i=0;i<names.length;i++){const v=(names[i]||'').trim();if(!v)break;key+='|'+v.toLowerCase();if(cache[key]){parent=loc=cache[key];continue}let h=L.find(l=>l.parent_id==parent&&l.name.toLowerCase()==v.toLowerCase());if(!h){const q=await sb.from('locations').insert({parent_id:parent,level:LV[i],name:v}).select().single();if(q.error)throw q.error;h=q.data;L.push(h)}parent=loc=h.id;cache[key]=h.id}return loc}
async function run(){const skip=$('#sk').checked;const go=rows.filter(r=>!r._e.length&&(!r._dup||(!skip&&r._dup!='Duplicate inside the file')));if(!go.length)return $('#er2').textContent='Nothing to import.';$('#go').disabled=true;const cache={},st=me.role=='data_entry'?'Pending Review':'Active';let ok=0,fail=[];
for(let i=0;i<go.length;i+=50){$('#go').textContent='Importing '+Math.min(i+50,go.length)+' of '+go.length+'…';const recs=[];for(const r of go.slice(i,i+50)){try{const loc=await resolveLoc([r.country,r.region,r.district,r.ward,r.village],cache);const sx=r.sex?r.sex[0].toUpperCase()+r.sex.slice(1).toLowerCase():null;
recs.push({first_name:r.first_name,middle_name:r.middle_name||null,last_name:r.last_name,sex:sx,date_of_birth:r.date_of_birth||null,phone:r.phone||null,email:r.email||null,department_id:r._d,category:r.category||null,position:r.position||null,address:r.address||null,nationality:r.nationality||null,notes:r.notes||null,location_id:loc,status:st})}catch(e){fail.push('Row '+r._n+': '+e.message)}}
if(recs.length){const x=await sb.from('beneficiaries').insert(recs);if(x.error)fail.push('Batch starting at row '+go[i]._n+': '+x.error.message);else ok+=recs.length}}
$('#pv').innerHTML=`<div class="card"><b>Done</b><p><b>${ok}</b> beneficiaries imported. ${fail.length} problem(s).</p>${fail.slice(0,20).map(f=>`<p class="msg">${esc(f)}</p>`).join('')}<a href="/beneficiaries.html"><button>View beneficiaries</button></a></div>`}
</script></body></html>
