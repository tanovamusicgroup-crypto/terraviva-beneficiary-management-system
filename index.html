<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraviva Beneficiary Management System</title><link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#2e7d32;--t:#00796b;--bg:#f3f7f4;--c:#fff;--tx:#17301f;--mu:#5c7165;--bd:#dbe6df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--c:#17251d;--tx:#e6f0ea;--mu:#9bb0a3;--bd:#27382e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:20px}
.login{width:100%;max-width:400px;text-align:center}.login img{width:150px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;text-align:left;font-size:13px;color:var(--mu)}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button.s{background:var(--bd);color:var(--tx)}
a{color:var(--t);cursor:pointer;font-size:14px}.pw{position:relative}.pw span{position:absolute;right:10px;top:12px;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:40px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}nav button{background:none;color:var(--tx)}nav button.on{background:var(--g);color:#fff}
main{padding:16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.n{font-size:28px;font-weight:700;color:var(--g)}.mu{color:var(--mu);font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.tw{overflow-x:auto}.bar{height:10px;background:var(--g);border-radius:5px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.msg{color:#c62828;font-size:14px}
</style></head><body><div id="app"></div>
<script>
const sb=supabase.createClient('https://rhkdzihvndbfanhodlex.supabase.co','sb_publishable_CRzNoKrPLp-G6o6P98Ua6w_-0VhGfpp');
const $=s=>document.querySelector(s),app=$('#app');let me=null,depts=[],page='dash';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loginView(mode='in',msg=''){app.innerHTML=`<div class="center"><div class="card login"><img src="logo.png" alt="Terraviva"><h2>Terraviva Beneficiary Management System</h2><p class="mu">Protecting Nature, Empowering Communities.</p>
${mode=='up'?'<label>Full name</label><input id="fn">':''}<label>Email address</label><input id="em" type="email">
${mode=='forgot'?'':'<label>Password</label><div class="pw"><input id="pw" type="password"><span id="eye">👁</span></div>'}
<p class="msg" id="m">${esc(msg)}</p><button style="width:100%" id="go">${{in:'Sign In',up:'Create Account',forgot:'Send Reset Link'}[mode]}</button><p>
${mode=='in'?'<a id="l1">Forgot password?</a> · <a id="l2">Create account</a>':'<a id="l3">Back to Sign In</a>'}</p></div></div>`;
const e=$('#eye');if(e)e.onclick=()=>{const p=$('#pw');p.type=p.type=='password'?'text':'password'};
const l1=$('#l1');if(l1){l1.onclick=()=>loginView('forgot');$('#l2').onclick=()=>loginView('up')}if($('#l3'))$('#l3').onclick=()=>loginView();
$('#go').onclick=async()=>{const em=$('#em').value,pw=$('#pw')?.value;let r;
if(mode=='in')r=await sb.auth.signInWithPassword({email:em,password:pw});
else if(mode=='up'){r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('#fn').value}}});if(!r.error&&!r.data.session)return loginView('in','Account created. Check your email to confirm, then sign in.')}
else{r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});return loginView('in',r.error?r.error.message:'Password reset link sent to your email.')}
if(r.error)$('#m').textContent=r.error.message;else start()}}
async function start(){const{data:{user}}=await sb.auth.getUser();if(!user)return loginView();
me=(await sb.from('profiles').select('*').eq('id',user.id).single()).data;depts=(await sb.from('departments').select('*').order('name')).data||[];shell()}
const R={dash:'Dashboard',ben:'Beneficiaries',ev:'Training & Events',pr:'Projects'};
function shell(){app.innerHTML=`<header><img src="logo.png"><nav>${Object.entries(me.role=='super_admin'?{...R,us:'Users'}:R).map(([k,v])=>`<button data-p="${k}" class="${k==page?'on':''}">${v}</button>`).join('')}</nav><span class="mu">${esc(me?.full_name)} · ${esc((me?.role||'').replace('_',' '))}</span><a href="/reports.html" style="color:var(--t)">Reports</a> <a href="/manage.html" style="color:var(--t)">Manage</a><button class="s" id="out">Sign Out</button></header><main id="main"></main>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.p;shell()});$('#out').onclick=async()=>{await sb.auth.signOut();loginView()};({dash,ben,ev,pr,us})[page]()}
const cnt=(rows,f)=>{const m={};rows.forEach(r=>{const k=f(r)||'Unassigned';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
function bars(t,e){const mx=Math.max(1,...e.map(x=>x[1]));return`<div class="card"><b>${t}</b>${e.map(([k,v])=>`<p class="mu">${esc(k)} — ${v}<div class="bar" style="width:${v/mx*100}%"></div></p>`).join('')||'<p class="mu">No data yet.</p>'}</div>`}
async function locName(){const L=(await sb.from('locations').select('*')).data||[];const by=Object.fromEntries(L.map(l=>[l.id,l]));const path=id=>{let p=[],c=by[id];while(c){p.unshift(c.name);c=by[c.parent_id]}return p};return{L,by,path}}
async function dash(){const[b,e,{path}]=await Promise.all([sb.from('beneficiaries').select('*'),sb.from('events').select('*'),locName()]);const B=b.data||[],E=e.data||[],t=new Date().toISOString().slice(0,10),dn=Object.fromEntries(depts.map(d=>[d.id,d.name]));
$('#main').innerHTML=`<div class="grid">${[['Total Beneficiaries',B.length],['Active',B.filter(x=>x.status=='Active').length],['Inactive',B.filter(x=>x.status=='Inactive').length],['Trainings In Progress',E.filter(x=>x.start_date<=t&&x.end_date>=t&&x.status!='Cancelled').length],['Upcoming Events',E.filter(x=>x.start_date>t&&x.status!='Cancelled').length],['Completed Events',E.filter(x=>x.status=='Completed').length],['Missing Phone',B.filter(x=>!x.phone).length]].map(([k,v])=>`<div class="card"><div class="n">${v}</div><div class="mu">${k}</div></div>`).join('')}</div>
<div class="row">${bars('By Department',cnt(B,x=>dn[x.department_id]))}${bars('By Gender',cnt(B,x=>x.sex))}${bars('By Location (Village/Street)',cnt(B,x=>path(x.location_id).join(' → ')))}</div>`}
async function ben(){const{L,path}=await locName();const dn=Object.fromEntries(depts.map(d=>[d.id,d.name]));const canW=['super_admin','org_admin','dept_manager','data_entry'].includes(me.role);
const{data}=await sb.from('beneficiaries').select('*').order('created_at',{ascending:false});let B=data||[];
const lv=(p)=>L.filter(l=>l.parent_id==p).map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('');
$('#main').innerHTML=`${canW?`<div class="card" style="margin-bottom:16px"><b>Register Beneficiary</b><div class="row"><div><label>First name</label><input id="f1"></div><div><label>Middle name</label><input id="f2"></div><div><label>Last name</label><input id="f3"></div><div><label>Sex</label><select id="sx"><option></option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label>Phone</label><input id="ph"></div><div><label>Department</label><select id="dp">${depts.filter(d=>d.active).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>Category</label><input id="ct" placeholder="e.g. Smallholder Farmer"></div></div>
<div class="row" id="lc"></div><p class="msg" id="m"></p><button id="sv">Register</button></div>`:''}
<div class="row"><div><label>Search</label><input id="q" placeholder="Name or ID"></div><div><label>Department</label><select id="fd"><option value="">All</option>${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div style="flex:0;align-self:end"><button class="s" id="csv">Export CSV</button></div></div><div class="card tw"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Location</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>`;
const draw=()=>{const q=$('#q').value.toLowerCase(),f=$('#fd').value;const X=B.filter(x=>(!f||x.department_id==f)&&(x.code+' '+x.first_name+' '+x.last_name).toLowerCase().includes(q));$('#tb').innerHTML=X.map(x=>`<tr><td>${x.code}</td><td>${esc(x.first_name+' '+x.last_name)}</td><td>${esc(dn[x.department_id])}</td><td>${esc(path(x.location_id).join(' → '))}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No beneficiaries found.</td></tr>';return X};draw();$('#q').oninput=draw;$('#fd').onchange=draw;
$('#csv').onclick=()=>{const X=draw();const c=[['ID','First','Last','Sex','Department','Location','Status'],...X.map(x=>[x.code,x.first_name,x.last_name,x.sex,dn[x.department_id],path(x.location_id).join(' > '),x.status])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='beneficiaries.csv';a.click()};
if(canW){const lv=['Country','Region','District','Ward','Village/Street'];const lc=$('#lc');
lc.innerHTML=lv.map((n,i)=>`<div><label>${n}</label><input data-lv="${i}" list="dl${i}" autocomplete="off" placeholder="Type or select"><datalist id="dl${i}"></datalist></div>`).join('');
const ins=[...lc.querySelectorAll('input')];
const sug=()=>{let parent=null;ins.forEach((inp,i)=>{const opts=parent===false?[]:L.filter(l=>l.parent_id==parent);$('#dl'+i).innerHTML=opts.map(o=>`<option value="${esc(o.name)}">`).join('');const hit=opts.find(o=>o.name.toLowerCase()==inp.value.trim().toLowerCase());parent=hit?hit.id:false})};
ins.forEach(i=>i.oninput=sug);sug();
$('#sv').onclick=async()=>{let loc=null,parent=null;
for(let i=0;i<ins.length;i++){const v=ins[i].value.trim();if(!v)break;let hit=L.find(l=>l.parent_id==parent&&l.name.toLowerCase()==v.toLowerCase());
if(!hit){const q=await sb.from('locations').insert({parent_id:parent,level:lv[i],name:v}).select().single();if(q.error){$('#m').textContent=q.error.message;return}hit=q.data;L.push(hit)}
parent=hit.id;loc=hit.id}
const r=await sb.from('beneficiaries').insert({first_name:$('#f1').value,middle_name:$('#f2').value||null,last_name:$('#f3').value,sex:$('#sx').value||null,phone:$('#ph').value||null,department_id:$('#dp').value,category:$('#ct').value||null,location_id:loc});if(r.error)$('#m').textContent=r.error.message;else ben()}}}
async function ev(){const dn=Object.fromEntries(depts.map(d=>[d.id,d.name]));const{data}=await sb.from('events').select('*').order('start_date',{ascending:false});const canW=['super_admin','org_admin','dept_manager'].includes(me.role),t=new Date().toISOString().slice(0,10);
$('#main').innerHTML=`${canW?`<div class="card" style="margin-bottom:16px"><b>Create Training / Event</b><div class="row"><div><label>Title</label><input id="a1"></div><div><label>Type</label><select id="a2">${['Training','Seminar','Workshop','Community Meeting','Awareness Campaign','Field Demonstration'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Department</label><select id="a3">${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>Start date</label><input id="a4" type="date"></div><div><label>End date</label><input id="a5" type="date"></div><div><label>Venue</label><input id="a6"></div><div><label>Facilitator</label><input id="a7"></div></div><p class="msg" id="m"></p><button id="sv">Create</button></div>`:''}
<div class="card tw"><table><tr><th>Title</th><th>Type</th><th>Department</th><th>Dates</th><th>Days</th><th>Venue</th><th>Status</th><th></th></tr>${(data||[]).map(x=>{const d=Math.round((new Date(x.end_date)-new Date(x.start_date))/864e5)+1;const s=x.status=='Cancelled'?x.status:x.end_date<t?'Completed':x.start_date<=t?'In Progress':'Planned';return`<tr><td>${esc(x.title)}</td><td>${x.event_type}</td><td>${esc(dn[x.department_id])}</td><td>${x.start_date} → ${x.end_date}</td><td>${d}</td><td>${esc(x.venue)}</td><td>${s}</td><td><button class="s" data-att="${x.id}">Attendance</button></td></tr>`}).join('')||'<tr><td colspan=8 class="mu">No events yet.</td></tr>'}</table></div>`;
document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>att(b.dataset.att));
if(canW)$('#sv').onclick=async()=>{const r=await sb.from('events').insert({title:$('#a1').value,event_type:$('#a2').value,department_id:$('#a3').value,start_date:$('#a4').value,end_date:$('#a5').value,venue:$('#a6').value||null,facilitator:$('#a7').value||null});if(r.error)$('#m').textContent=r.error.message;else ev()}}
async function pr(){const dn=Object.fromEntries(depts.map(d=>[d.id,d.name]));const{data}=await sb.from('projects').select('*').order('created_at',{ascending:false});const canW=['super_admin','org_admin'].includes(me.role);
$('#main').innerHTML=`${canW?`<div class="card" style="margin-bottom:16px"><b>Create Project</b><div class="row"><div><label>Name</label><input id="p1"></div><div><label>Department</label><select id="p2">${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div><label>Status</label><select id="p3">${['Draft','Planned','Approved','Active','On Hold','Completed','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Funder</label><input id="p4"></div><div><label>Target beneficiaries</label><input id="p5" type="number"></div></div><p class="msg" id="m"></p><button id="sv">Create</button></div>`:''}
<div class="card tw"><table><tr><th>Project</th><th>Department</th><th>Status</th><th>Funder</th><th>Target</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(dn[x.department_id])}</td><td>${x.status}</td><td>${esc(x.funder)}</td><td>${x.target_beneficiaries??''}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No projects yet.</td></tr>'}</table></div>`;
if(canW)$('#sv').onclick=async()=>{const r=await sb.from('projects').insert({name:$('#p1').value,department_id:$('#p2').value,status:$('#p3').value,funder:$('#p4').value||null,target_beneficiaries:+$('#p5').value||null});if(r.error)$('#m').textContent=r.error.message;else pr()}}
async function att(id){const{data:e}=await sb.from('events').select('*').eq('id',id).single();
const B=(await sb.from('beneficiaries').select('id,code,first_name,last_name').eq('department_id',e.department_id).eq('status','Active').order('code')).data||[];
const A=(await sb.from('attendance').select('*').eq('event_id',id)).data||[];const canW=['super_admin','org_admin','dept_manager','project_officer'].includes(me.role);let day=e.start_date;
const draw=()=>{const m={};A.filter(a=>a.day==day).forEach(a=>m[a.beneficiary_id]=a.status);const pr=A.filter(a=>a.status=='Present'||a.status=='Late').length;
$('#main').innerHTML=`<button class="s" id="bk">← Back</button><h3>${esc(e.title)} — Attendance</h3><p class="mu">Overall attendance rate: ${A.length?Math.round(pr/A.length*100):0}% (${pr} of ${A.length} records)</p><label>Day</label><input type="date" id="dy" min="${e.start_date}" max="${e.end_date}" value="${day}"><div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Status</th></tr>${B.map(b=>`<tr><td>${b.code}</td><td>${esc(b.first_name+' '+b.last_name)}</td><td><select data-b="${b.id}" ${canW?'':'disabled'}><option value="">—</option>${['Present','Absent','Late','Excused'].map(s=>`<option ${m[b.id]==s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=3 class="mu">No active beneficiaries in this department.</td></tr>'}</table></div><p class="msg" id="m"></p>${canW?'<button id="sv">Save Attendance</button>':''}`;
$('#bk').onclick=ev;$('#dy').onchange=x=>{day=x.target.value;draw()};
if(canW)$('#sv').onclick=async()=>{const rows=[...document.querySelectorAll('select[data-b]')].filter(s=>s.value).map(s=>({event_id:id,beneficiary_id:s.dataset.b,day,status:s.value}));const r=await sb.from('attendance').upsert(rows,{onConflict:'event_id,beneficiary_id,day'});if(r.error)return $('#m').textContent=r.error.message;const n=(await sb.from('attendance').select('*').eq('event_id',id)).data||[];A.length=0;A.push(...n);draw()}};draw()}
async function us(){const{data}=await sb.from('profiles').select('*').order('created_at');const roles=['super_admin','org_admin','dept_manager','project_officer','me_officer','data_entry','donor','read_only'];
$('#main').innerHTML=`<div class="card tw"><table><tr><th>Name</th><th>Role</th><th>Department</th><th>Active</th></tr>${data.map(u=>`<tr><td>${esc(u.full_name)}</td><td><select data-u="${u.id}" data-f="role">${roles.map(r=>`<option ${u.role==r?'selected':''}>${r}</option>`).join('')}</select></td><td><select data-u="${u.id}" data-f="department_id"><option value="">—</option>${depts.map(d=>`<option value="${d.id}" ${u.department_id==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></td><td><input type="checkbox" data-u="${u.id}" data-f="active" ${u.active?'checked':''}></td></tr>`).join('')}</table></div><p class="mu">Changes save automatically. Department managers and data entry officers need a department assigned.</p><p class="msg" id="m"></p>`;
document.querySelectorAll('[data-u]').forEach(el=>el.onchange=async()=>{const v=el.type=='checkbox'?el.checked:(el.value||null);const r=await sb.from('profiles').update({[el.dataset.f]:v}).eq('id',el.dataset.u);$('#m').textContent=r.error?r.error.message:''})}
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){const p=prompt('Enter your new password');if(p)sb.auth.updateUser({password:p})}});start();
</script></body></html>
