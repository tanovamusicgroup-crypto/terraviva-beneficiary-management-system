const fopts=Object.entries(lab).map(([id,l])=>`<option value="${id}" ${id==dlink?'selected':''}>${esc(l)}</option>`).join('');
const med=rows.filter(x=>x.kind!='document').map(x=>x.path),mp={};if(med.length){const r=await sb.storage.from('documents').createSignedUrls(med,3600);(r.data||[]).forEach(x=>{if(x.signedUrl)mp[x.path]=x.signedUrl})}
m.innerHTML=`${canU?`<div class="card"><b>Upload documents, photos or videos</b><p class="mu">You can select many files at once. They are all attached to the same event or project.</p><div class="row"><div><label>Title (optional)</label><input id="d1" placeholder="Leave empty to use the file names"></div><div><label>Attach to</label><select id="d2"><option value="">— None —</option>${opts}</select></div></div><label>Files (max 50 MB each)</label><input id="d3" type="file" multiple><label><input id="d4" type="checkbox"> Share with donors</label><p class="msg" id="er"></p><button id="sv">Upload</button></div>`:''}
<div class="card"><div class="row"><div><label>Show</label><select id="fk">${[['all','Everything'],['photo','Photos'],['video','Videos'],['document','Documents']].map(([v,l])=>`<option value="${v}" ${v==dkind?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Attached to</label><select id="fl"><option value="all">All events and projects</option>${fopts}</select></div></div></div><div id="gal"></div>`;
const draw=()=>{const X=rows.filter(x=>(dkind=='all'||x.kind==dkind)&&(dlink=='all'||x.linked_id==dlink));
$('#gal').innerHTML=X.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px">${X.map(x=>`<div class="card" style="margin:0;padding:12px" data-id="${x.id}"><div data-open="${x.id}" style="cursor:pointer">${x.kind=='photo'?`<img src="${mp[x.path]||''}" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:10px;display:block">`:x.kind=='video'?`<div style="position:relative"><video src="${mp[x.path]||''}#t=0.5" preload="metadata" muted playsinline style="width:100%;height:170px;object-fit:cover;border-radius:10px;display:block;background:#000"></video><span style="position:absolute;left:8px;bottom:8px;background:#fff;color:#111;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600">▶ Video</span></div>`:`<div style="height:170px;display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--bg);border-radius:10px">📄</div>`}</div>
<div style="margin-top:8px"><b style="word-break:break-word">${esc(x.title)}</b><div class="mu">${({document:'Document',photo:'Photo',video:'Video'})[x.kind]} · ${esc(lab[x.linked_id]||'Not attached')}<br>${x.shared_with_donors?'Shared with donors':'Staff only'}</div></div>
<div style="margin-top:8px"><button class="s" data-open="${x.id}">Open</button><button class="s" data-dl="${x.id}">Download</button>${adm?`<button class="s" data-sh="${x.id}">${x.shared_with_donors?'Unshare':'Share'}</button>`:''}${adm||x.uploaded_by==uid?`<button class="s" data-rm="${x.id}">Delete</button>`:''}</div></div>`).join('')}</div>`:'<div class="card"><p class="mu">Nothing to show.</p></div>';
const g=id=>rows.find(r=>r.id==id);
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const x=g(b.dataset.open);if(x.kind!='document')return openMedia(x.kind,mp[x.path],x.title);const r=await sb.storage.from('documents').createSignedUrl(x.path,300);if(r.error)return alert(r.error.message);if(/\.pdf$/i.test(x.path))openMedia('doc',r.data.signedUrl,x.title,true);else window.open(r.data.signedUrl,'_blank')});
document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const x=g(b.dataset.dl);const r=await sb.storage.from('documents').createSignedUrl(x.path,300,{download:true});if(r.error)alert(r.error.message);else window.location.href=r.data.signedUrl});
document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=async()=>{const x=g(b.dataset.sh);const r=await sb.from('documents').update({shared_with_donors:!x.shared_with_donors}).eq('id',x.id);if(r.error)alert(r.error.message);else docs()});
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const x=g(b.dataset.rm);if(!confirm('Delete "'+x.title+'"?'))return;await sb.storage.from('documents').remove([x.path]);await sb.from('documents').delete().eq('id',x.id);docs()})};
draw();$('#fk').onchange=e=>{dkind=e.target.value;draw()};$('#fl').onchange=e=>{dlink=e.target.value;draw()};
if(canU)$('#sv').onclick=async()=>{const fs=[...$('#d3').files];if(!fs.length)return $('#er').textContent='Choose at least one file.';const base=$('#d1').value.trim(),[ty,id]=($('#d2').value||':').split(':'),sh=$('#d4').checked,bad=[];$('#sv').disabled=true;
for(let i=0;i<fs.length;i++){const f=fs[i];$('#sv').textContent='Uploading '+(i+1)+' of '+fs.length+'…';if(f.size>52428800){bad.push(f.name+' (over 50 MB)');continue}
const kind=f.type.startsWith('image/')?'photo':f.type.startsWith('video/')?'video':'document';const path=uid+'/'+Date.now()+'_'+i+'_'+f.name.replace(/[^\w.\-]/g,'_');
const u=await sb.storage.from('documents').upload(path,f,{contentType:f.type||undefined});if(u.error){bad.push(f.name+' ('+u.error.message+')');continue}
const title=fs.length==1?(base||f.name):(base?base+' ('+(i+1)+')':f.name);
const r=await sb.from('documents').insert({title,path,kind,linked_type:ty||null,linked_id:id||null,shared_with_donors:sh});if(r.error){bad.push(f.name+' ('+r.error.message+')');await sb.storage.from('documents').remove([path])}}
await docs();if(bad.length&&$('#er'))$('#er').textContent='Not uploaded: '+bad.join('; ')}}
</script></body></html>
