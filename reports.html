<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraviva Reports</title><link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="shared.js"></script>
<style>
:root{--g:#2e7d32;--bg:#f3f7f4;--c:#fff;--tx:#17301f;--mu:#5c7165;--bd:#dbe6df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--c:#17251d;--tx:#e6f0ea;--mu:#9bb0a3;--bd:#27382e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:40px}header a{color:var(--g);font-size:14px}header a:first-of-type{margin-left:auto}
main{padding:16px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}.n{font-size:28px;font-weight:700;color:var(--g)}.mu{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--g);border-radius:5px}button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;margin:4px 4px 0 0;cursor:pointer;font:inherit}button.s{background:var(--bd);color:var(--tx)}
input,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tw{overflow-x:auto}.msg{color:#c62828;font-size:14px}
</style></head><body><header><img src="logo.png" alt="Terraviva"><b>Reports</b><a href="/">Dashboard</a><a href="/programs.html" id="lp">Programs</a><a href="/manage.html" id="lm">Manage</a></header><main id="m"><p class="mu">Loading…</p></main>
<script>
const sb=window.SB;
const $=s=>document.querySelector(s),m=$('#m'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,uid;const fmt=d=>new Date(d).toLocaleDateString();
const bars=(t,a)=>{const mx=Math.max(1,...a.map(x=>x.n));return`<div class="card"><b>${t}</b>${a.map(x=>`<p class="mu">${esc(x.name)} — ${x.n}</p><div class="bar" style="width:${x.n/mx*100}%"></div>`).join('')||'<p class="mu">No data yet.</p>'}</div>`};
const cards=s=>`<div class="grid">${[['Total Beneficiaries',s.total],['Projects',s.projects],['Events',s.events],['Completed Events',s.completed_events],['Attendance Rate',s.attendance_rate+'%']].map(([k,v])=>`<div class="card"><div class="n">${v}</div><div class="mu">${k}</div></div>`).join('')}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${bars('Beneficiaries by Department',s.by_department)}${bars('Beneficiaries by Gender',s.by_sex)}</div>`;
const locT=l=>`<div class="card tw"><b>Beneficiaries by Location</b><table><tr><th>Location</th><th>Level</th><th>Beneficiaries</th></tr>${l.map(x=>`<tr><td>${esc(x.path)}</td><td>${x.level}</td><td>${x.n}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">No data yet.</td></tr>'}</table></div>`;
const csv=async(tbl,name)=>{const{data,error}=await sb.from(tbl).select('*');if(error)return alert(error.message);if(!data.length)return alert('No data to export.');const k=Object.keys(data[0]);const c=[k,...data.map(r=>k.map(x=>r[x]))].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name+'.csv';a.click()};
const RP={};const repCard=r=>(RP[r.id]=r,`<div class="card"><button class="s" style="float:right" onclick="pdfReport('${r.id}')">Download PDF</button><b>${esc(r.title)}</b> <span class="mu">${esc(r.period||'')} · ${r.status=='approved'?'Approved '+fmt(r.approved_at):'Draft'}</span><p>${esc(r.narrative).replace(/\n/g,'<br>')}</p>${r.snapshot?.summary?cards(r.snapshot.summary)+locT(r.snapshot.locations||[]):''}`);
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return m.innerHTML='<p>Please <a href="/">sign in</a> first.</p>';uid=user.id;
me=(await sb.from('profiles').select('*').eq('id',uid).single()).data;if(!me)return m.innerHTML='<p class="mu">You do not have access to reports.</p>';
if(me.role=='donor'){$('#lp').remove();$('#lm').remove();return donor()}staff()})();
function pdfReport(id){const r=RP[id];if(!r)return;const s=r.snapshot&&r.snapshot.summary,l=(r.snapshot&&r.snapshot.locations)||[];const w=window.open('','_blank');if(!w)return alert('Please allow pop-ups to download the PDF.');
const tb=(h,a)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+a.map(q=>'<tr>'+q.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';let b='';
if(s){b='<div>'+[['Total beneficiaries',s.total],['Projects',s.projects],['Events',s.events],['Completed events',s.completed_events],['Attendance rate',s.attendance_rate+'%']].map(k=>'<div class="k"><b>'+k[1]+'</b>'+k[0]+'</div>').join('')+'</div><h3>Beneficiaries by department</h3>'+tb(['Department','Beneficiaries'],s.by_department.map(x=>[x.name,x.n]))+'<h3>Beneficiaries by gender</h3>'+tb(['Gender','Beneficiaries'],s.by_sex.map(x=>[x.name,x.n]))+'<h3>Beneficiaries by location</h3>'+tb(['Location','Level','Beneficiaries'],l.map(x=>[x.path,x.level,x.n]))}
w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(r.title)+'</title><style>body{font-family:Arial,sans-serif;color:#17301f;margin:30px}h1{color:#2e7d32;margin:0}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #ccc;padding:6px;text-align:left;font-size:13px}th{background:#eef5ef}.k{display:inline-block;border:1px solid #cfe3d3;border-radius:8px;padding:8px 14px;margin:4px;text-align:center}.k b{display:block;font-size:20px;color:#2e7d32}.hd{display:flex;align-items:center;gap:16px;border-bottom:3px solid #2e7d32;padding-bottom:10px;margin-bottom:16px}.ft{margin-top:30px;font-size:12px;color:#666;border-top:1px solid #ccc;padding-top:8px}</style></head><body><div class="hd"><img src="'+location.origin+'/logo.png" height="70"><div><h1>Terraviva</h1><div>Protecting Nature, Empowering Communities.</div></div></div><h2>'+esc(r.title)+'</h2><p>'+esc(r.period||'')+' · '+(r.status=='approved'?'Approved '+fmt(r.approved_at):'Draft')+'</p><p>'+esc(r.narrative).replace(/\n/g,'<br>')+'</p>'+b+'<div class="ft">Generated '+new Date().toLocaleString()+' · Terraviva Beneficiary Management System</div><scr'+'ipt>onload=function(){setTimeout(function(){print()},500)}</scr'+'ipt></body></html>');w.document.close()}
async function donor(){const[r,d]=await Promise.all([sb.from('published_reports').select('*').eq('status','approved').order('approved_at',{ascending:false}),sb.from('documents').select('*').order('created_at',{ascending:false})]);
m.innerHTML=(r.data||[]).map(x=>repCard(x)+'</div>').join('')||'<p class="mu">No approved reports have been shared with you yet.</p>';
if((d.data||[]).length){m.innerHTML+=`<div class="card tw"><b>Shared documents, photos and videos</b><table>${d.data.map((x,i)=>`<tr><td>${x.kind=='photo'&&x.url?`<img src="${cldImg(x.url,'f_auto,q_auto,w_160,h_100,c_fill')}" alt="" style="height:50px;border-radius:6px;vertical-align:middle;margin-right:8px">`:''}${esc(x.title)}</td><td>${({document:'Document',photo:'Photo',video:'Video'})[x.kind]||'Document'}</td><td><button class="s" data-dl="${i}">Open</button></td></tr>`).join('')}</table></div>`;
document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const x=d.data[+b.dataset.dl];if(x.provider=='cloudinary')return openMedia(x.kind,x.kind=='video'?cldVideo(x.url):cldImg(x.url),x.title);const u=await sb.storage.from('documents').createSignedUrl(x.path,300);if(u.error)return alert(u.error.message);const pf=/\.pdf$/i.test(x.path);if(x.kind!='document'||pf)openMedia(x.kind=='document'?'doc':x.kind,u.data.signedUrl,x.title,pf);else window.open(u.data.signedUrl,'_blank')})}}
async function staff(){const[a,b,r]=await Promise.all([sb.rpc('donor_summary'),sb.rpc('location_summary'),sb.from('published_reports').select('*').order('created_at',{ascending:false})]);const s=a.data,l=b.data||[];
if(!s)return m.innerHTML='<p class="mu">You do not have access to reports.</p>';const canR=['super_admin','org_admin','me_officer','project_officer'].includes(me.role),adm=['super_admin','org_admin'].includes(me.role);
m.innerHTML=`${cards(s)}${locT(l)}<div class="card"><b>Export data (CSV)</b><br><button data-t="beneficiaries">Beneficiaries</button><button data-t="events">Events</button><button data-t="attendance">Attendance</button><button data-t="projects">Projects</button><button class="s" id="lv">Summary PDF</button></div>
${canR?`<div class="card"><b>Create a report for donors</b><p class="mu">Saves a snapshot of the figures above. Donors see it only after it is approved.</p><label>Title</label><input id="r1"><label>Reporting period</label><input id="r2" placeholder="e.g. Jan – Mar 2027"><label>Narrative</label><textarea id="r3" rows="4"></textarea><p class="msg" id="er"></p><button id="rs">Save as draft</button></div>`:''}
<h3>Donor reports</h3>${(r.data||[]).map(x=>repCard(x)+`${adm&&x.status=='draft'?`<button data-ap="${x.id}">Approve &amp; share</button>`:''}${adm?`<button class="s" data-rm="${x.id}">Delete</button>`:''}</div>`).join('')||'<p class="mu">No reports yet.</p>'}`;
m.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>csv(x.dataset.t,'terraviva_'+x.dataset.t));$('#lv').onclick=()=>{RP.live={id:'live',title:'Organization summary',period:todayEAT(),narrative:'',snapshot:{summary:s,locations:l},status:'approved',approved_at:new Date().toISOString()};pdfReport('live')};
m.querySelectorAll('[data-ap]').forEach(x=>x.onclick=async()=>{const u=await sb.from('published_reports').update({status:'approved',approved_by:uid,approved_at:new Date().toISOString()}).eq('id',x.dataset.ap);if(u.error)alert(u.error.message);else staff()});
m.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{if(confirm('Delete this report?')){await sb.from('published_reports').delete().eq('id',x.dataset.rm);staff()}});
if(canR)$('#rs').onclick=async()=>{if(!$('#r1').value.trim())return $('#er').textContent='Title is required.';const i=await sb.from('published_reports').insert({title:$('#r1').value.trim(),period:$('#r2').value||null,narrative:$('#r3').value,snapshot:{summary:s,locations:l}});if(i.error)$('#er').textContent=i.error.message;else staff()}}
</script></body></html>
