<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraviva Beneficiaries</title><link rel="icon" href="logo.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e7d32">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="shared.js"></script>
<style>
:root{--g:#2e7d32;--bg:#f3f7f4;--c:#fff;--tx:#17301f;--mu:#5c7165;--bd:#dbe6df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--c:#17251d;--tx:#e6f0ea;--mu:#9bb0a3;--bd:#27382e}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd);flex-wrap:wrap}header img{height:40px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}nav button{background:none;color:var(--tx)}nav button.on{background:var(--g);color:#fff}header a{color:var(--g);font-size:14px}
main{padding:16px;max-width:1100px;margin:auto}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}.warn{background:#fff8e1;border-color:#f9a825;color:#5d4037}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto}

.mu{color:var(--mu);font-size:13px}.msg{color:#c62828;font-size:14px}.ok{color:var(--g)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:170px}.chip{display:inline-block;margin:3px 10px 3px 0;color:var(--tx)}

</style></head><body><header><img src="logo.png" alt="Terraviva"><nav id="nav"></nav><a href="/">Dashboard</a><a href="/import.html" id="li">Import</a><a href="/programs.html">Programs</a><a href="/reports.html">Reports</a><a href="/manage.html">Manage</a></header><div style="max-width:1100px;margin:auto;padding:0 16px" id="bn"></div><main id="m"><p class="mu">Loading…</p></main>
<script>
const sb=window.SB;const $=s=>document.querySelector(s),m=$('#m'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV=['Country','Region','District','Ward','Village/Street'],REV=['super_admin','org_admin','dept_manager'],WR=['super_admin','org_admin','dept_manager','data_entry'];
let me,uid,depts=[],cats=[],pos=[],projs=[],L=[],LB={},tab='ls',pg=0,PS=25,filt={q:'',dep:'',st:'',loc:''},syncing=false;
const dn=()=>Object.fromEntries(depts.map(d=>[d.id,d.name]));
const pathOf=id=>{let p=[],c=LB[id];while(c){p.unshift(c.name);c=LB[c.parent_id]}return p};
const addLoc=l=>{L.push(l);LB[l.id]=l};
const descIds=id=>{const o=[id];for(let i=0;i<o.length;i++)L.forEach(l=>{if(l.parent_id==o[i])o.push(l.id)});return o};
const age=d=>{if(!d)return '';const t=new Date(),b=new Date(d);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const pill=s=>`<span class="b b-${s=='Active'?'completed':s=='Pending Review'?'progress':'draft'}">${s}</span>`;
const isNet=e=>e instanceof TypeError||/fetch|network|offline/i.test((e&&e.message)||'');
const QK='tbms_queue',getQ=()=>{try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){return[]}},setQ=a=>localStorage.setItem(QK,JSON.stringify(a));
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return m.innerHTML='<p>Please <a href="/">sign in</a> first.</p>';uid=user.id;
me=(await sb.from('profiles').select('*').eq('id',uid).single()).data;if(!me)return m.innerHTML='<p class="mu">No access.</p>';if(!WR.includes(me.role))$('#li').remove();
try{const R=await Promise.all([sb.from('departments').select('*').order('name'),sb.from('categories').select('*').eq('active',true).order('name'),sb.from('positions').select('*').eq('active',true).order('name'),sb.from('projects').select('id,name').order('name'),fetchAll((f,t)=>sb.from('locations').select('*').range(f,t))]);
depts=R[0].data||[];cats=R[1].data||[];pos=R[2].data||[];projs=R[3].data||[];L=R[4];L.forEach(l=>LB[l.id]=l);
try{localStorage.setItem('tbms_ref',JSON.stringify({depts,cats,pos,projs,L}))}catch(e){}}catch(e){try{const c=JSON.parse(localStorage.getItem('tbms_ref'));depts=c.depts;cats=c.cats;pos=c.pos;projs=c.projs;L=c.L;L.forEach(l=>LB[l.id]=l)}catch(x){}}
const h=location.hash;const d=h.match(/^#dep:(.+)$/),lc=h.match(/^#loc:(.+)$/);if(d)filt.dep=d[1];if(lc)filt.loc=lc[1];if(h=='#review'&&REV.includes(me.role))tab='rv';
addEventListener('online',()=>{banner();sync()});addEventListener('offline',banner);banner();sync();
if(h.startsWith('#id:'))return openP(h.slice(4));nav()})();
function nav(){const t={ls:'All beneficiaries'};if(WR.includes(me.role))t.rg='Register';if(REV.includes(me.role))t.rv='Review queue';
$('#nav').innerHTML=Object.entries(t).map(([k,v])=>`<button data-k="${k}" class="${k==tab?'on':''}">${v}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;location.hash='';nav()});({ls,rg:reg,rv})[tab]()}
function banner(){const n=getQ().length;$('#bn').innerHTML=(navigator.onLine?'':'<div class="card warn" style="margin-top:12px">You are offline. New registrations are saved on this device and sent when you are back online.</div>')+(n?`<div class="card warn" style="margin-top:12px">${n} registration(s) waiting to be sent. <button class="s" id="sy">Send now</button></div>`:'');if($('#sy'))$('#sy').onclick=sync}
async function sync(){if(!navigator.onLine||syncing)return;const q=getQ();if(!q.length||!me)return;syncing=true;const keep=[];
for(let i=0;i<q.length;i++){try{await insertRec(q[i].c,'Pending Review','(Registered offline - please check for duplicates.)')}catch(e){keep.push(q[i]);if(isNet(e)){keep.push(...q.slice(i+1));break}}}
setQ(keep);syncing=false;banner();if(tab=='ls'&&!location.hash)load()}
async function resolveLoc(names){let parent=null,loc=null;for(let i=0;i<names.length;i++){const v=(names[i]||'').trim();if(!v)break;let h=L.find(l=>l.parent_id==parent&&l.name.toLowerCase()==v.toLowerCase());
if(!h){const q=await sb.from('locations').insert({parent_id:parent,level:LV[i],name:v}).select().single();if(q.error)throw q.error;h=q.data;addLoc(h)}parent=h.id;loc=h.id}return loc}
const qf=(sel,o)=>{let q=sb.from('beneficiaries').select(sel,o).order('created_at',{ascending:false});if(filt.q){const s=filt.q.replace(/[,()%*]/g,' ').trim();if(s)q=q.or(`first_name.ilike.%${s}%,last_name.ilike.%${s}%,code.ilike.%${s}%,phone.ilike.%${s}%`)}
if(filt.dep)q=q.eq('department_id',filt.dep);if(filt.st)q=q.eq('status',filt.st);if(filt.loc)q=q.in('location_id',descIds(filt.loc));return q};
function ls(){m.innerHTML=`<div class="card"><div class="row"><div><label>Search (name, ID or phone)</label><input id="q" value="${esc(filt.q)}"></div><div><label>Department</label><select id="fd"><option value="">All</option>${depts.map(d=>`<option value="${d.id}" ${d.id==filt.dep?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div><label>Status</label><select id="fs"><option value="">All</option>${['Active','Inactive','Pending Review'].map(s=>`<option ${s==filt.st?'selected':''}>${s}</option>`).join('')}</select></div></div>
${filt.loc?`<p class="mu">Location: <b>${esc(pathOf(filt.loc).join(' → '))}</b> <button class="s" id="cl">Clear location</button></p>`:''}<button class="s" id="ex">Export CSV</button></div>
<div class="card tw"><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Department</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody id="tb"><tr><td colspan=7 class="mu">Loading…</td></tr></tbody></table></div><div id="pgr"></div>`;
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{filt.q=e.target.value;pg=0;load()},350)};$('#fd').onchange=e=>{filt.dep=e.target.value;pg=0;load()};$('#fs').onchange=e=>{filt.st=e.target.value;pg=0;load()};if($('#cl'))$('#cl').onclick=()=>{filt.loc='';location.hash='';ls()};
$('#ex').onclick=exp;load()}
async function load(){const r=await qf('id,code,first_name,middle_name,last_name,phone,department_id,status,location_id,category',{count:'exact'}).range(pg*PS,pg*PS+PS-1);const D=dn();
if(r.error){$('#tb').innerHTML=`<tr><td colspan=7 class="msg">${esc(r.error.message)}</td></tr>`;return}
$('#tb').innerHTML=(r.data||[]).map(x=>`<tr><td>${x.code}</td><td>${esc([x.first_name,x.middle_name,x.last_name].filter(Boolean).join(' '))}</td><td>${esc(x.phone)}</td><td>${esc(D[x.department_id])}</td><td>${esc(pathOf(x.location_id).join(' → '))}</td><td>${pill(x.status)}</td><td><button class="s" data-id="${x.id}">Open</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">No beneficiaries found.</td></tr>';
const n=r.count||0,a=n?pg*PS+1:0,b=Math.min(n,pg*PS+PS);$('#pgr').innerHTML=`<p class="mu">Showing ${a}–${b} of ${n}</p><button class="s" id="pv" ${pg?'':'disabled'}>← Previous</button><button class="s" id="nx" ${b>=n?'disabled':''}>Next →</button>`;
$('#pv').onclick=()=>{pg--;load()};$('#nx').onclick=()=>{pg++;load()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{location.hash='id:'+b.dataset.id;openP(b.dataset.id)})}
async function exp(){const D=dn();let X;try{X=await fetchAll((f,t)=>qf('code,first_name,middle_name,last_name,sex,date_of_birth,phone,email,department_id,category,status,location_id,created_at').range(f,t))}catch(e){return alert(e.message)}
const c=[['ID','First name','Middle name','Last name','Sex','Date of birth','Phone','Email','Department','Category','Location','Status','Registered'],...X.map(x=>[x.code,x.first_name,x.middle_name,x.last_name,x.sex,x.date_of_birth,x.phone,x.email,D[x.department_id],x.category,pathOf(x.location_id).join(' > '),x.status,x.created_at])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='beneficiaries.csv';a.click()}
function fh(b){b=b||{};const dsel=b.department_id||(['dept_manager','data_entry'].includes(me.role)?me.department_id:'');const lp=b.location_id?pathOf(b.location_id):[];
const f=(id,l,v,t)=>`<div><label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}"></div>`;
const sel=(id,l,o,v)=>`<div><label>${l}</label><select id="${id}"><option value=""></option>${o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
return `<div id="frm"><div class="card"><b>Personal information</b><div class="row">${f('x_first','First name *',b.first_name)}${f('x_middle','Middle name',b.middle_name)}${f('x_last','Last name *',b.last_name)}${f('x_pref','Preferred name',b.preferred_name)}${sel('x_sex','Sex',['Female','Male','Other'],b.sex)}${f('x_dob','Date of birth',b.date_of_birth,'date')}<div><label>Age</label><input id="x_age" disabled value="${age(b.date_of_birth)}"></div>${f('x_nat','Nationality',b.nationality)}${f('x_res','Country of residence',b.residence_country)}${f('x_phone','Primary phone',b.phone)}${f('x_alt','Alternative phone',b.alt_phone)}${f('x_email','Email',b.email,'email')}${sel('x_contact','Preferred contact method',['Phone call','SMS','WhatsApp','Email','In person'],b.preferred_contact)}${f('x_addr','Residential address',b.address)}</div></div>
<div class="card"><b>Participation</b><div class="row"><div><label>Department *</label><select id="x_dept">${depts.filter(d=>d.active||d.id==b.department_id).map(d=>`<option value="${d.id}" ${d.id==dsel?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div><label>Category</label><input id="x_cat" list="dlc" value="${esc(b.category)}"><datalist id="dlc"></datalist></div><div><label>Role or position</label><input id="x_pos" list="dlp" value="${esc(b.position)}"><datalist id="dlp">${pos.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div>${f('x_grp','Community group or association',b.community_group)}<div><label>Project or program</label><select id="x_proj"><option value=""></option>${projs.map(p=>`<option value="${p.id}" ${p.id==b.project_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${f('x_ps','Participation start',b.participation_start,'date')}${f('x_pe','Participation end',b.participation_end,'date')}${f('x_off','Assigned project officer',b.assigned_officer)}${f('x_mgr','Assigned department manager',b.assigned_manager)}</div>
<label>Also participates in these departments (optional)</label><div>${depts.filter(d=>d.active).map(d=>`<label class="chip"><input type="checkbox" class="xm" value="${d.id}" ${(b._more||[]).includes(d.id)?'checked':''}> ${esc(d.name)}</label>`).join('')}</div></div>
<div class="card"><b>Location</b><div class="row" id="x_loc">${LV.map((n,i)=>`<div><label>${n}</label><input data-lv="${i}" list="dll${i}" autocomplete="off" value="${esc(lp[i]||'')}" placeholder="Type or select"><datalist id="dll${i}"></datalist></div>`).join('')}</div></div>
<div class="card"><b>Sensitive information (optional)</b><p class="mu">Only record what is necessary for the program, and only with the person's consent.</p><div class="row">${f('x_emn','Emergency contact name',b.emergency_name)}${f('x_emr','Relationship',b.emergency_relationship)}${f('x_emp','Emergency contact phone',b.emergency_phone)}</div><label>Disability or accessibility requirements</label><input id="x_acc" value="${esc(b.accessibility_needs)}"><label><input type="checkbox" id="x_con" ${b.consent_given?'checked':''}> The person has given consent for their information to be recorded</label>${f('x_cd','Consent date',b.consent_date,'date')}</div>
<div class="card"><label>Notes</label><textarea id="x_notes" rows="3">${esc(b.notes)}</textarea></div></div>`}
function wire(){const upC=()=>{$('#dlc').innerHTML=cats.filter(c=>c.department_id==$('#x_dept').value).map(c=>`<option value="${esc(c.name)}">`).join('')};$('#x_dept').onchange=upC;upC();$('#x_dob').onchange=()=>$('#x_age').value=age($('#x_dob').value);
const ins=[...document.querySelectorAll('#x_loc input')];const sug=()=>{let p=null;ins.forEach((inp,i)=>{const o=p===false?[]:L.filter(l=>l.parent_id==p);$('#dll'+i).innerHTML=o.map(x=>`<option value="${esc(x.name)}">`).join('');const h=o.find(x=>x.name.toLowerCase()==inp.value.trim().toLowerCase());p=h?h.id:false})};ins.forEach(i=>i.oninput=sug);sug()}
function collect(){const v=id=>{const e=$('#'+id),s=e?e.value.trim():'';return s||null};
return{rec:{first_name:v('x_first'),middle_name:v('x_middle'),last_name:v('x_last'),preferred_name:v('x_pref'),sex:v('x_sex'),date_of_birth:v('x_dob'),nationality:v('x_nat'),residence_country:v('x_res'),phone:v('x_phone'),alt_phone:v('x_alt'),email:v('x_email'),preferred_contact:v('x_contact'),address:v('x_addr'),department_id:v('x_dept'),category:v('x_cat'),position:v('x_pos'),community_group:v('x_grp'),project_id:v('x_proj'),participation_start:v('x_ps'),participation_end:v('x_pe'),assigned_officer:v('x_off'),assigned_manager:v('x_mgr'),emergency_name:v('x_emn'),emergency_relationship:v('x_emr'),emergency_phone:v('x_emp'),accessibility_needs:v('x_acc'),consent_given:$('#x_con').checked,consent_date:v('x_cd'),notes:v('x_notes')},locs:[...document.querySelectorAll('#x_loc input')].map(i=>i.value.trim()),more:[...document.querySelectorAll('.xm:checked')].map(i=>i.value)}}
function validate(c){const r=c.rec;if(!r.first_name||!r.last_name)return 'First and last name are required.';if(!r.department_id)return 'Choose a department.';if((r.emergency_name||r.emergency_phone||r.accessibility_needs)&&!r.consent_given)return 'Consent must be recorded before saving emergency or accessibility information.';return ''}
async function insertRec(c,st,note){const loc=await resolveLoc(c.locs);const rec={...c.rec,location_id:loc,status:st};if(note)rec.notes=((rec.notes||'')+' '+note).trim();const r=await sb.from('beneficiaries').insert(rec).select('id,code').single();if(r.error)throw r.error;
const more=c.more.filter(x=>x!=rec.department_id);if(more.length)await sb.from('beneficiary_departments').insert(more.map(d=>({beneficiary_id:r.data.id,department_id:d})));return r.data}
function reg(){m.innerHTML=fh()+'<div id="dupbox"></div><p class="msg" id="er"></p><button id="sv">Register beneficiary</button>';wire();$('#sv').onclick=()=>save(false)}
function queue(c){const q=getQ();q.push({c,at:Date.now()});setQ(q);banner();m.innerHTML='<div class="card"><b>Saved on this device</b><p>The connection is not available. This registration will be sent automatically when you are back online, and it will go to the review queue.</p><button id="ag">Register another</button></div>';$('#ag').onclick=reg}
async function save(force){const c=collect(),e=validate(c);if(e)return $('#er').textContent=e;$('#er').textContent='';const st=me.role=='data_entry'?'Pending Review':'Active';
if(!navigator.onLine)return queue(c);
if(!force){const d=await sb.rpc('find_duplicates',{p_first:c.rec.first_name,p_last:c.rec.last_name,p_phone:c.rec.phone,p_dob:c.rec.date_of_birth});
if((d.data||[]).length){$('#dupbox').innerHTML=`<div class="card warn"><b>Possible duplicates found</b>${d.data.map(x=>`<p>${x.code} — ${esc(x.first_name+' '+x.last_name)} ${esc(x.phone||'')} (${x.status}) <a href="#id:${x.id}" target="_blank">Open</a></p>`).join('')}<p>If this is a different person, click <b>Register anyway</b>.</p><button id="fo">Register anyway</button></div>`;$('#fo').onclick=()=>save(true);return}}
$('#sv').disabled=true;try{const r=await insertRec(c,st);m.innerHTML=`<div class="card"><b class="ok">Registered: ${r.code}</b><p class="mu">${st=='Pending Review'?'The record is waiting for review by a manager.':'The record is active.'}</p><button id="ag">Register another</button> <button class="s" id="op">Open record</button></div>`;$('#ag').onclick=reg;$('#op').onclick=()=>{location.hash='id:'+r.id;openP(r.id)}}
catch(err){if(isNet(err))return queue(c);$('#sv').disabled=false;$('#er').textContent=err.message}}
async function rv(){const r=await sb.from('beneficiaries').select('id,code,first_name,last_name,phone,department_id,created_at').eq('status','Pending Review').order('created_at').limit(100);const D=dn();
m.innerHTML=`<div class="card tw"><b>Waiting for review</b><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Department</th><th>Registered</th><th></th></tr>${(r.data||[]).map(x=>`<tr><td>${x.code}</td><td>${esc(x.first_name+' '+x.last_name)}</td><td>${esc(x.phone)}</td><td>${esc(D[x.department_id])}</td><td>${new Date(x.created_at).toLocaleDateString()}</td><td><button class="s" data-id="${x.id}">Open</button><button data-ap="${x.id}">Approve</button><button class="d" data-rj="${x.id}">Reject</button></td></tr>`).join('')||'<tr><td colspan=6 class="mu">Nothing is waiting for review.</td></tr>'}</table></div><p class="msg" id="er"></p>`;
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{location.hash='id:'+b.dataset.id;openP(b.dataset.id)});document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>setSt(b.dataset.ap,'Active',null,rv));
document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{const n=prompt('Reason for rejecting this record:');if(n)setSt(b.dataset.rj,'Inactive','Rejected: '+n,rv)})}
async function setSt(id,st,note,back){const r=await sb.from('beneficiaries').update({status:st,review_note:note,reviewed_by:uid,reviewed_at:new Date().toISOString()}).eq('id',id).select();if(r.error||!r.data.length)return alert(r.error?r.error.message:'You are not allowed to change this record.');back()}
async function openP(id){m.innerHTML='<p class="mu">Loading…</p>';const R=await Promise.all([sb.from('beneficiaries').select('*').eq('id',id).single(),sb.from('beneficiary_departments').select('department_id').eq('beneficiary_id',id),sb.from('followups').select('*').eq('beneficiary_id',id).order('visit_date',{ascending:false}),sb.from('event_participants').select('completed,events(title,start_date,end_date)').eq('beneficiary_id',id)]);
const b=R[0].data;if(!b)return m.innerHTML='<div class="card"><p class="mu">Record not found, or you do not have access to it.</p><button class="s" id="bk">← Back</button></div>',$('#bk').onclick=()=>{location.hash='';nav()};
b._more=(R[1].data||[]).map(x=>x.department_id);const mgr=REV.includes(me.role)&&(me.role!='dept_manager'||b.department_id==me.department_id);const canE=mgr||(me.role=='data_entry'&&b.status=='Pending Review'&&b.department_id==me.department_id);
const canF=['super_admin','org_admin','dept_manager','project_officer','me_officer','data_entry'].includes(me.role),D=dn();let ph='';if(b.photo_path){const u=await sb.storage.from('documents').createSignedUrl(b.photo_path,3600);if(u.data)ph=`<img src="${u.data.signedUrl}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover">`}if(!ph)ph=avatarHTML(null,b.first_name,96);

${mgr&&b.status=='Pending Review'?'<button id="ap">Approve</button><button class="d" id="rj">Reject</button>':''}${mgr&&b.status=='Active'?'<button class="s" id="ia">Mark inactive</button>':''}${mgr&&b.status=='Inactive'?'<button class="s" id="ra">Reactivate</button>':''}</div></div>
${canE?`<div class="card"><b>Photo (only with consent)</b><p class="mu">${b.consent_given?'Choose a clear photo of the person.':'Record consent in the form below and save before adding a photo.'}</p><input type="file" id="phf" accept="image/*" ${b.consent_given?'':'disabled'}><button class="s" id="phb" ${b.consent_given?'':'disabled'}>Upload photo</button></div>`:''}
${fh(b)}<p class="msg" id="er"></p>${canE?'<button id="sv">Save changes</button>':'<p class="mu">You can view this record but not edit it.</p>'}
<div class="card" style="margin-top:14px"><b>Participation history</b><div class="tw"><table><tr><th>Event</th><th>Dates</th><th>Completed</th></tr>${(R[3].data||[]).filter(x=>x.events).map(x=>`<tr><td>${esc(x.events.title)}</td><td>${x.events.start_date} → ${x.events.end_date}</td><td>${x.completed?'Yes':'No'}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">Not registered for any event yet.</td></tr>'}</table></div></div>

<div class="tw"><table><tr><th>Date</th><th>Officer</th><th>Notes</th><th>Next visit</th></tr>${(R[2].data||[]).map(x=>`<tr><td>${x.visit_date}</td><td>${esc(x.officer)}</td><td>${esc(x.notes)}</td><td>${x.next_visit||''}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">No follow-up visits recorded.</td></tr>'}</table></div></div>`;
